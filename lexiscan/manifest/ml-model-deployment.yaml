apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-model-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-model
  template:
    metadata:
      labels:
        app: ml-model
    spec:
      containers:
        - name: ml-model
          image: dashbah/ml-classifier-app:latest
          volumeMounts:
            - name: ml-model-app-volume
              mountPath: /app/build/libs
            - name: model-volume
              mountPath: /app/models
      volumes:
        - name: ml-model-app-volume
          emptyDir: {}
        - name: model-volume
          hostPath:
            path: /mnt/ml-models/